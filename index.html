<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
.topo{background:#000;border-bottom:3px solid #ffcc00;padding:10px;display:flex;justify-content:space-between;align-items:center}
.btn-instalar{background:#ffcc00;color:#000;border:none;padding:10px 16px;border-radius:20px;font-weight:bold}
.card{background:#1a1a1a;border-radius:15px;margin:12px;padding:12px;display:flex;gap:10px}

.rodape{border:1px dashed #ffcc00;margin:15px;padding:30px;text-align:center;border-radius:12px;color:#555}
.pix{padding:20px;text-align:center;color:#aaa}
.pix b{color:#ffcc00}
#playerModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999}
#video{width:100%;height:70%;margin-top:60px;background:#000}
</style>
</head>
<body>

<div class="topo">

</div>

<div style="border:2px solid #ffcc00;margin:10px;padding:15px;border-radius:15px;text-align:center">
🔌 <b style="color:#ffcc00">Plug TV GRATIDÃO</b><br>✅ V21 - Player Corrigido
</div>

<div class="card"><div style="flex:1"><b>Cine Ação</b><br><button class="btn-ver" onclick="playVideo('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">▶️ VER GRÁTIS</button></div></div>
<div class="card"><div style="flex:1"><b>Cine Sucessos</b><br><button class="btn-ver" onclick="playVideo('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">▶️ VER GRÁTIS</button></div></div>
<div class="card"><div style="flex:1"><b>Chaves 24h</b><br><button class="btn-ver" onclick="playVideo('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">▶️ VER GRÁTIS</button></div></div>

<div id="playerModal">
<button onclick="fechar()" style="position:absolute;top:10px;right:10px;padding:10px;background:#ffcc00;border:none;border-radius:10px;font-weight:bold">✕ FECHAR</button>
<video id="video" controls autoplay></video>
</div>

<script>
function playVideo(url){
  document.getElementById('playerModal').style.display='block';
  var video = document.getElementById('video');
  if(Hls.isSupported()){var hls=new Hls();hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,function(){video.play();});}
  else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.play();}
}
function fechar(){
  document.getElementById('playerModal').style.display='none';
  document.getElementById('video').pause();
}
let promptEvent;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();promptEvent=e;});
document.getElementById('instalar').onclick=()=>{if(promptEvent)promptEvent.prompt();};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
