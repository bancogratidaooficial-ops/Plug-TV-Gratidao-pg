<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plug TV Gratidão - TV Online Grátis</title>

<!-- SEU CÓDIGO GOOGLE ADSENSE JÁ INSTALADO -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2504730768556065" crossorigin="anonymous"></script>

<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<style>
  body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif;text-align:center}
  header{padding:20px;background:#1a1a1a}
  h1{color:#ffd700;margin:0}
  .player{width:100%;max-width:900px;margin:20px auto;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
  iframe{width:100%;height:100%;border:0}
  .lista{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:20px}
  .canal{padding:10px 18px;background:#222;border-radius:20px;cursor:pointer;border:1px solid #333}
  .canal:hover{background:#ffd700;color:#000}
  .anuncio{margin:20px auto;min-height:90px;background:#1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#888}
</style>
</head>
<body>
<header>
  <h1>Plug TV Gratidão 🙏</h1>
  <p>Canais ao vivo grátis</p>
</header>

<div class="anuncio">
  <!-- Anúncio Google vai aparecer aqui -->
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-2504730768556065"
       data-ad-slot="auto"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div class="player">
  <iframe id="tv" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0" allowfullscreen></iframe>
</div>

<div class="lista">
  <div class="canal" onclick="document.getElementById('tv').src='https://www.youtube.com/embed/jfKfPfyJRdk'">Globo</div>
  <div class="canal" onclick="document.getElementById('tv').src='https://www.youtube.com/embed/2GfK4cO5h0w'">SBT</div>
  <div class="canal" onclick="document.getElementById('tv').src='https://www.youtube.com/embed/F7SlprO1u1E'">Record</div>
</div>

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
